<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>亂鬥競技場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* 版面：全螢幕畫布遊戲，大廳與結算是疊在上方的面板。單一亮色街機風格，不跟系統深淺色切換。 */
:root {
  --sky: #1d63d8;
  --sky-deep: #0f3c9a;
  --ink: #160b22;
  --gold: #ffcf2e;
  --gold-deep: #d99a00;
  --paper: #ffffff;
  --mint: #3fd46a;
  --danger: #ff4f45;
  --panel: rgba(10, 22, 70, 0.55);
  --display: "Lilita One", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky-deep); color: var(--paper); font-family: var(--body); }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
canvas#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.stroke { -webkit-text-stroke: 0.09em var(--ink); paint-order: stroke fill; text-shadow: 0 0.09em 0 var(--ink); }

.overlay {
  position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 28px, rgba(255,255,255,0) 28px 56px),
    radial-gradient(120% 90% at 50% 0%, #3d8bff 0%, var(--sky) 45%, var(--sky-deep) 100%);
  display: flex; flex-direction: column; gap: 12px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: clamp(24px, 4vw, 38px); letter-spacing: 0.02em; color: var(--gold); line-height: 1; }
.brand small { display: block; font-size: 0.42em; color: var(--paper); letter-spacing: 0.25em; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 6px; font-family: var(--display); font-size: 22px; }
.pill svg { width: 30px; height: 30px; }
.lobby-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: center; max-width: 1080px; width: 100%; margin: 0 auto; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
#preview { width: min(300px, 70vw, 30vh); aspect-ratio: 1; max-width: 100%; }
.bname { font-family: var(--display); font-size: clamp(28px, 4.4vw, 44px); line-height: 1; text-align: center; }
.brole { font-size: 14px; letter-spacing: 0.2em; color: #cfe1ff; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 420px; margin: 6px 0 0; }
.stats div { background: var(--panel); border: 2px solid rgba(0,0,0,0.45); border-radius: 10px; padding: 6px 4px; text-align: center; min-width: 0; }
.stats dt { font-size: 11px; letter-spacing: 0.15em; color: #b9d0ff; }
.stats dd { margin: 0; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.superline { font-size: 13px; color: #ffe88a; text-align: center; max-width: 420px; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.label { font-family: var(--display); font-size: 16px; letter-spacing: 0.18em; color: #cfe1ff; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.card { appearance: none; border: 3px solid var(--ink); border-radius: 14px; background: linear-gradient(180deg, #6fb2ff, #2a6fe0); color: var(--paper); padding: 6px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--display); font-size: 15px; box-shadow: 0 5px 0 var(--ink); transition: transform 0.08s; min-width: 0; }
.card canvas { width: 72px; height: 72px; max-width: 100%; }
.card[aria-pressed="true"] { background: linear-gradient(180deg, #ffe066, #f4a90b); color: var(--ink); }
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.card:focus-visible, .btn:focus-visible, .mini:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.mode { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #2bb35a, #168a3f); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 0 5px 0 var(--ink); }
.mode svg { width: 44px; height: 44px; flex: none; }
.mode b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; }
.mode span { font-size: 13px; color: #e2ffe9; }
.btn { appearance: none; border: 4px solid var(--ink); border-radius: 16px; background: linear-gradient(180deg, #ffe45c, var(--gold) 55%, var(--gold-deep)); color: var(--paper); font-family: var(--display); font-size: 34px; padding: 10px 18px 12px; cursor: pointer; box-shadow: 0 7px 0 var(--ink); transition: transform 0.08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
.btn.secondary { background: linear-gradient(180deg, #7cc0ff, #2f7ee8); font-size: 22px; }
.howto { font-size: 13px; line-height: 1.6; color: #dbe8ff; background: var(--panel); border-radius: 12px; padding: 10px 12px; }
.howto b { color: var(--gold); font-weight: 900; }

#hudbar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; z-index: 5; }
.mini { appearance: none; border: 3px solid var(--ink); border-radius: 10px; background: rgba(10, 22, 70, 0.7); color: var(--paper); font-family: var(--display); font-size: 15px; padding: 4px 10px; cursor: pointer; }

#result { align-items: center; justify-content: center; text-align: center; background: radial-gradient(90% 80% at 50% 30%, rgba(61,139,255,0.95), rgba(15,60,154,0.97)); }
.rank { font-family: var(--display); font-size: clamp(64px, 14vw, 120px); line-height: 0.9; color: var(--gold); }
.rank small { display: block; font-size: 0.3em; color: var(--paper); margin-top: 8px; }
.tdelta { font-family: var(--display); font-size: 30px; display: inline-flex; align-items: center; gap: 8px; }
.tdelta svg { width: 36px; height: 36px; }
.rstats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.rstats div { background: var(--panel); border-radius: 12px; padding: 8px 14px; min-width: 92px; }
.rstats dt { font-size: 12px; letter-spacing: 0.15em; color: #b9d0ff; }
.rstats dd { margin: 0; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.rbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 760px), (max-height: 520px) and (orientation: landscape) {
  .lobby-main { grid-template-columns: minmax(0, 1fr); }
  .btn { font-size: 28px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .lobby-main { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
  #preview { width: min(180px, 36vh); }
  .howto { display: none; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudbar" hidden>
  <button class="mini" id="quit" type="button">離開</button>
  <button class="mini" id="mute" type="button">音效 開</button>
  <button class="mini" id="zoom" type="button">視野 標準</button>
</div>

<div id="lobby" class="overlay">
  <header class="topbar">
    <div class="brand stroke">亂鬥競技場<small>BRAWL ARENA</small></div>
    <div class="pill stroke"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v6a8 8 0 0 1-16 0z" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 6H3v2a5 5 0 0 0 5 5M24 6h5v2a5 5 0 0 1-5 5" fill="none" stroke="#160b22" stroke-width="2.5"/><path d="M13 18h6v5h3v5H10v-5h3z" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5" stroke-linejoin="round"/></svg><span id="trophies">0</span></div>
  </header>
  <main class="lobby-main">
    <section class="stage">
      <canvas id="preview" width="300" height="300"></canvas>
      <div class="bname stroke" id="bname"></div>
      <div class="brole" id="brole"></div>
      <dl class="stats" id="bstats"></dl>
      <div class="superline" id="bsuper"></div>
    </section>
    <section class="side">
      <div class="label">選擇鬥士</div>
      <div class="cards" id="cards"></div>
      <div class="mode">
        <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="20" r="15" fill="#e9fff0" stroke="#160b22" stroke-width="3"/><rect x="14" y="30" width="16" height="9" rx="2" fill="#e9fff0" stroke="#160b22" stroke-width="3"/><circle cx="16" cy="20" r="4.5" fill="#160b22"/><circle cx="28" cy="20" r="4.5" fill="#160b22"/><path d="M19 34v4M22 34v4M25 34v4" stroke="#160b22" stroke-width="2"/></svg>
        <div><b class="stroke">荒野決鬥 · 單人</b><span>10 名鬥士，毒霧從四周逼近，打破能量箱變強，活到最後就贏。</span></div>
      </div>
      <button class="btn stroke" id="play" type="button">開戰！</button>
      <div class="howto">
        <b>手機</b>：左半邊任意處拖曳移動。右下紅色搖桿拖曳瞄準、放開射擊，輕點自動瞄準。黃色大招鈕集滿後才能用，用法相同。<br>
        <b>電腦</b>：WASD 或方向鍵移動。按住滑鼠左鍵瞄準、放開射擊，右鍵是大招。空白鍵自動射擊，E 自動大招。
      </div>
    </section>
  </main>
</div>

<div id="result" class="overlay" hidden>
  <div class="rank stroke" id="rrank"></div>
  <div class="tdelta stroke"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16v6a8 8 0 0 1-16 0z" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 6H3v2a5 5 0 0 0 5 5M24 6h5v2a5 5 0 0 1-5 5" fill="none" stroke="#160b22" stroke-width="2.5"/><path d="M13 18h6v5h3v5H10v-5h3z" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5" stroke-linejoin="round"/></svg><span id="rdelta"></span></div>
  <dl class="rstats" id="rstats"></dl>
  <div class="rbtns">
    <button class="btn stroke" id="again" type="button">再來一場</button>
    <button class="btn secondary stroke" id="home" type="button">回大廳</button>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 儲存 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('brawlArena.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('brawlArena.' + k, JSON.stringify(v)); } catch {} }
};

// ---------- 音效 ----------
let AC = null, muted = store.get('muted', false), lastHitSnd = 0;
function snd(type) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const set = (wave, f0, f1, dur, vol) => {
      o.type = wave; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    };
    if (type === 'shoot') set('square', 420, 120, 0.09, 0.05);
    else if (type === 'hit') { if (t - lastHitSnd < 0.05) { o.disconnect(); return; } lastHitSnd = t; set('triangle', 260, 80, 0.08, 0.08); }
    else if (type === 'cube') set('sine', 500, 1400, 0.25, 0.12);
    else if (type === 'super') set('sawtooth', 160, 700, 0.35, 0.09);
    else if (type === 'die') set('sawtooth', 300, 40, 0.5, 0.1);
    else if (type === 'box') set('square', 180, 50, 0.2, 0.08);
    else if (type === 'tick') set('sine', 880, 880, 0.12, 0.08);
  } catch {}
}

// ---------- 地圖 ----------
const N = 40, C = N / 2;
const FLOOR = 0, WALL = 1, BORDER = 2, BUSH = 3, WATER = 4, BOX = 5;
let map = new Uint8Array(N * N), boxHp = new Float32Array(N * N), spawns = [];
const tAt = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? BORDER : map[y * N + x];
const solidMove = t => t === WALL || t === BORDER || t === WATER || t === BOX;
const solidShot = t => t === WALL || t === BORDER || t === BOX;
const BOX_HP = 2800;

function genMap() {
  const Q = 20, q = new Uint8Array(Q * Q);
  const qset = (x, y, v, only) => { if (x < 1 || y < 1 || x >= Q || y >= Q) return; if (only != null && q[y * Q + x] !== only) return; q[y * Q + x] = v; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  for (let k = 0; k < 10; k++) {
    const x = ri(2, 18), y = ri(2, 18), s = ri(0, 3), len = ri(2, 4);
    if (s === 0) for (let i = 0; i < len; i++) qset(x + i, y, WALL);
    else if (s === 1) for (let i = 0; i < len; i++) qset(x, y + i, WALL);
    else if (s === 2) { for (let i = 0; i < len; i++) qset(x + i, y, WALL); for (let i = 0; i < len; i++) qset(x, y + i, WALL); }
    else { qset(x, y, WALL); qset(x + 1, y, WALL); qset(x, y + 1, WALL); qset(x + 1, y + 1, WALL); }
  }
  for (let k = 0; k < 8; k++) {
    const cx = ri(2, 18), cy = ri(2, 18), rad = 1 + rnd() * 1.6;
    for (let y = cy - 3; y <= cy + 3; y++) for (let x = cx - 3; x <= cx + 3; x++)
      if (hyp(x - cx, y - cy) < rad + rnd() * 0.7) qset(x, y, BUSH, FLOOR);
  }
  if (rnd() < 0.85) { const wx = ri(4, 14), wy = ri(4, 14), ww = ri(2, 3), wh = ri(1, 2); for (let y = wy; y < wy + wh; y++) for (let x = wx; x < wx + ww; x++) qset(x, y, WATER); }
  let placed = 0, guard = 0;
  while (placed < 3 && guard++ < 200) { const x = ri(3, 18), y = ri(3, 18); if (q[y * Q + x] === FLOOR) { q[y * Q + x] = BOX; placed++; } }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const qx = x < Q ? x : N - 1 - x, qy = y < Q ? y : N - 1 - y;
    map[y * N + x] = (x === 0 || y === 0 || x === N - 1 || y === N - 1) ? BORDER : q[qy * Q + qx];
  }
  for (let y = C - 2; y < C + 2; y++) for (let x = C - 2; x < C + 2; x++) if (map[y * N + x] !== BUSH) map[y * N + x] = FLOOR;
  spawns = [];
  const a0 = rnd() * TAU;
  for (let i = 0; i < 10; i++) {
    const a = a0 + i * TAU / 10, sx = C + Math.cos(a) * 14.5, sy = C + Math.sin(a) * 14.5;
    spawns.push({ x: Math.floor(sx) + 0.5, y: Math.floor(sy) + 0.5 });
    for (let y = Math.floor(sy) - 1; y <= Math.floor(sy) + 1; y++) for (let x = Math.floor(sx) - 1; x <= Math.floor(sx) + 1; x++)
      if (x > 0 && y > 0 && x < N - 1 && y < N - 1 && map[y * N + x] !== BUSH) map[y * N + x] = FLOOR;
  }
  const flood = () => {
    const seen = new Uint8Array(N * N), qu = [C * N + C]; seen[C * N + C] = 1;
    while (qu.length) { const i = qu.pop(), x = i % N, y = (i / N) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const j = (y + dy) * N + x + dx, t = map[j];
        if (!seen[j] && (t === FLOOR || t === BUSH || t === BOX)) { seen[j] = 1; qu.push(j); } } }
    return seen;
  };
  let seen = flood();
  for (const s of spawns) {
    if (seen[Math.floor(s.y) * N + Math.floor(s.x)]) continue;
    let x = s.x, y = s.y; const d = hyp(C - x, C - y);
    for (let i = 0; i < d * 3; i++) { x += (C - s.x) / (d * 3); y += (C - s.y) / (d * 3);
      const j = Math.floor(y) * N + Math.floor(x); if (map[j] === WALL || map[j] === WATER) map[j] = FLOOR; }
    seen = flood();
  }
  for (let i = 0; i < N * N; i++) {
    if (!seen[i] && (map[i] === FLOOR || map[i] === BUSH || map[i] === BOX)) map[i] = WALL;
    boxHp[i] = map[i] === BOX ? BOX_HP : 0;
  }
}

// ---------- 鬥士 ----------
const BR = {
  shelly: {
    name: '散彈蕾拉', role: '散彈槍手', color: '#9a58d8', hp: 3800, speed: 2.55, range: 7.2, reload: 1.5, superCost: 2600,
    dmgText: '5 × 300', superText: '大招「超級霰彈」：9 發大範圍散彈，擊退敵人並轟碎牆壁。',
    aim: { kind: 'cone', half: 0.24 }, superAim: { kind: 'cone', half: 0.3, range: 7.6 },
    attack(e, a) { for (let i = -2; i <= 2; i++) shoot(e, a + i * 0.11 + (rnd() - 0.5) * 0.03, { speed: 14, range: this.range, dmg: 300, r: 0.13, color: '#ffd23f' }); },
    super(e, a) { for (let i = -4; i <= 4; i++) shoot(e, a + i * 0.065, { speed: 15, range: 7.6, dmg: 330, r: 0.16, color: '#ffef7a', breakWalls: true, kb: 2.4, isSuper: true }); }
  },
  colt: {
    name: '快槍柯特', role: '神槍手', color: '#e5483a', hp: 3000, speed: 2.55, range: 9.2, reload: 1.6, superCost: 3000,
    dmgText: '6 × 300', superText: '大招「彈雨連發」：12 發長距離子彈，一路打穿牆壁。',
    aim: { kind: 'line', w: 0.34 }, superAim: { kind: 'line', w: 0.5, range: 11 },
    attack(e, a) { for (let i = 0; i < 6; i++) e.queue.push({ at: T + i * 0.085, fn: () => shoot(e, e.burstA + (i % 2 ? 0.02 : -0.02), { speed: 18, range: this.range, dmg: 300, r: 0.12, color: '#ffffff' }) }); e.burstA = a; },
    super(e, a) { e.burstA = a; for (let i = 0; i < 12; i++) e.queue.push({ at: T + i * 0.06, fn: () => shoot(e, e.burstA + (i % 2 ? 0.03 : -0.03), { speed: 19, range: 11, dmg: 330, r: 0.15, color: '#ffe066', breakWalls: true, isSuper: true }) }); }
  },
  primo: {
    name: '鐵拳摔角王', role: '重裝坦克', color: '#3a7be0', hp: 6000, speed: 2.7, range: 3.1, reload: 1.15, superCost: 2400,
    dmgText: '4 × 380', superText: '大招「飛身重壓」：跳過障礙物砸向目標，震碎牆壁、彈開周圍敵人。',
    aim: { kind: 'line', w: 0.7 }, superAim: { kind: 'leap', range: 6.5 },
    attack(e, a) { e.burstA = a; for (let i = 0; i < 4; i++) e.queue.push({ at: T + i * 0.09, fn: () => shoot(e, e.burstA + (i % 2 ? 0.12 : -0.12), { speed: 12, range: this.range, dmg: 380, r: 0.3, color: '#ff4040', kind: 'fist' }) }); },
    super(e, a, frac) {
      const d = 6.5 * clamp(frac == null ? 1 : frac, 0.25, 1);
      e.leap = { sx: e.x, sy: e.y, tx: clamp(e.x + Math.cos(a) * d, 1.5, N - 1.5), ty: clamp(e.y + Math.sin(a) * d, 1.5, N - 1.5), t: 0, dur: 0.7 };
    }
  }
};
const BR_KEYS = Object.keys(BR);
const BOT_NAMES = ['阿肥', '小龍蝦', '火星人', '綠茶', '布丁', '阿豪', '雞排', 'Pixel', 'Dino', 'Taro', 'Momo', 'Kuma', '鹹酥雞', 'Zed', '米糕'];

// ---------- 遊戲狀態 ----------
let T = 0, gameT = 0, state = 'lobby';
let ents = [], projs = [], cubes = [], parts = [], floats = [], feed = [];
let player = null, playerRank = 0, resultTimer = 0, shake = 0;
const GAS_START = 14, GAS_END = 110;

  for (let t = C - sh; t <= C + sh; t += step) {
    const r = S * (0.55 + wob(t));
    for (const [x, y] of [[t, C - sh], [t, C + sh], [C - sh, t], [C + sh, t]]) { ctx.beginPath(); ctx.arc(ox + x * S, oy + y * S, r, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1f6d4a'; ctx.fillRect(0, 0, W, H);
  if (!player) return;
  let sx = 0, sy = 0;
  if (shake > 0 && !reduceMotion) { sx = (rnd() - 0.5) * shake * 30; sy = (rnd() - 0.5) * shake * 30; }
  const ox = Math.round(W / 2 - cam.x * S + sx), oy = Math.round(H / 2 - cam.y * S + sy - S * 0.45);
  const x0 = Math.max(0, Math.floor(-ox / S) - 1), x1 = Math.min(N - 1, Math.ceil((W - ox) / S) + 1);
  const y0 = Math.max(0, Math.floor(-oy / S) - 1), y1 = Math.min(N - 1, Math.ceil((H - oy) / S) + 2);
  drawFloor(x0, x1, y0, y1, ox, oy);
  // 腳下光圈與影子
  for (const e of ents) {
    if (!e.alive) continue;
    const vis = e.isPlayer || canSee(player, e) || !player.alive;
    if (!vis) continue;
    const px = ox + e.x * S, py = oy + e.y * S;
    ctx.beginPath(); ctx.ellipse(px, py, S * 0.42, S * 0.2, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(px, py, S * 0.48, S * 0.25, 0, 0, TAU); ctx.lineWidth = S * 0.06; ctx.strokeStyle = e.isPlayer ? '#3ec7ff' : '#ff4f45'; ctx.stroke();
  }
  if (state === 'play') drawAim(ox, oy);
  for (const c of cubes) {
    const px = ox + c.x * S, py = oy + c.y * S;
    ctx.beginPath(); ctx.ellipse(px, py, S * 0.22, S * 0.1, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill();
  }
  const sorted = ents.filter(e => e.alive).sort((a, b) => a.y - b.y);
  const labels = [];
  let ei = 0;
  const pBushT = player.alive ? [Math.floor(player.x), Math.floor(player.y)] : null;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) { const t = tAt(x, y); if (t === WALL || t === BORDER || t === BOX) drawTileUpright(x, y, ox, oy); }
    for (const c of cubes) if (Math.floor(c.y) === y) drawCubeIcon(ox + c.x * S, oy + c.y * S - S * 0.35 + Math.sin(c.t * 3) * S * 0.06, S * 0.22);
    while (ei < sorted.length && sorted[ei].y < y + 1) {
      const e = sorted[ei++];
      if (e.y < y) continue;
      const vis = e.isPlayer || canSee(player, e) || !player.alive;
      if (!vis) continue;
      const hidden = inBush(e) && T > e.revealT;
      const px = ox + e.x * S, py = oy + e.y * S;
      drawBrawler(ctx, e.key, px, py, S * 0.42, e.face, { z: e.z * S, flash: e.flash, alpha: hidden ? 0.6 : 1 });
      labels.push(e);
    }
    for (let x = x0; x <= x1; x++) if (tAt(x, y) === BUSH) drawTileUpright(x, y, ox, oy, pBushT && Math.abs(x - pBushT[0]) <= 1 && Math.abs(y - pBushT[1]) <= 1);
  }
  for (const p of projs) {
    const px = ox + p.x * S, py = oy + p.y * S;
    ctx.beginPath(); ctx.ellipse(px, py, p.r * S, p.r * S * 0.5, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill();
    ctx.save(); ctx.translate(px, py - S * 0.5); ctx.rotate(p.a);
    ctx.lineWidth = Math.max(1.5, S * 0.04); ctx.strokeStyle = INK;
    if (p.kind === 'fist') { ctx.beginPath(); ctx.arc(0, 0, p.r * S * 0.9, 0, TAU); ctx.fillStyle = p.color; ctx.fill(); ctx.stroke(); }
    else { rr(ctx, -p.r * S * 1.6, -p.r * S * 0.75, p.r * S * 3.2, p.r * S * 1.5, p.r * S * 0.7); ctx.fillStyle = p.color; ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  for (const p of parts) { ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(ox + p.x * S - p.r * S / 2, oy + p.y * S - p.r * S / 2, p.r * S, p.r * S); }
  ctx.globalAlpha = 1;
  drawGas(ox, oy);
  for (const e of labels) drawLabel(e, ox + e.x * S, oy + e.y * S - e.z * S);
  for (const f of floats) { ctx.globalAlpha = 1 - Math.max(0, f.t - 0.5) / 0.4; txt(ctx, f.txt, ox + f.x * S, oy + f.y * S, Math.round(S * 0.42), f.col); }
  ctx.globalAlpha = 1;
  drawHud();
}
function drawLabel(e, px, py) {
  const w = S * 1.3, h = S * 0.24, top = py - S * 1.62;
  txt(ctx, e.name, px, top - S * 0.24, Math.round(S * 0.3), e.isPlayer ? '#9fe6ff' : '#ffffff');
  rr(ctx, px - w / 2, top - h / 2, w, h, h * 0.35); ctx.fillStyle = INK; ctx.fill();
  const f = clamp(e.hp / e.maxHp, 0, 1);
  rr(ctx, px - w / 2 + 2, top - h / 2 + 2, Math.max(0, (w - 4) * f), h - 4, h * 0.25); ctx.fillStyle = e.isPlayer ? '#3fd46a' : '#ff4f45'; ctx.fill();
  txt(ctx, String(Math.ceil(e.hp)), px, top + 0.5, Math.round(S * 0.22), '#ffffff', 'center', 2.5);
  if (e.cubes) { drawCubeIcon(px - w / 2 - S * 0.2, top, S * 0.16); txt(ctx, String(e.cubes), px - w / 2 - S * 0.2, top + S * 0.24, Math.round(S * 0.2), '#ffffff'); }
  if (e.isPlayer) {
    const aw = (w - 4) / 3;
    for (let i = 0; i < 3; i++) {
      const bx = px - w / 2 + i * (aw + 2), by = top + h / 2 + 2;
      rr(ctx, bx, by, aw, h * 0.6, 3); ctx.fillStyle = INK; ctx.fill();
      const fill = clamp(e.ammo - i, 0, 1);
      if (fill > 0) { ctx.fillStyle = fill >= 1 ? '#ff9a1f' : 'rgba(255,154,31,0.5)'; ctx.fillRect(bx + 1.5, by + 1.5, (aw - 3) * fill, h * 0.6 - 3); }
    }
    if (e.superCharge >= 1) { ctx.beginPath(); ctx.ellipse(px, py, S * 0.6, S * 0.31, 0, 0, TAU); ctx.strokeStyle = `rgba(255,214,60,${0.6 + Math.sin(T * 8) * 0.3})`; ctx.lineWidth = S * 0.07; ctx.stroke(); }
  }
}
function drawStick(x, y, kx, ky, col, label, active, dim) {
  ctx.save(); ctx.globalAlpha = dim ? 0.45 : 1;
  ctx.beginPath(); ctx.arc(x, y, STICK_R, 0, TAU); ctx.fillStyle = 'rgba(10,20,60,0.35)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(kx, ky, (active ? 30 : 34) * U, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  if (label) txt(ctx, label, kx, ky, 15, '#ffffff');
  ctx.restore();
}
function drawHud() {
  const alive = ents.filter(e => e.alive).length;
  const cx = W / 2, ty = W < 560 ? 76 : 34;
  ctx.save(); ctx.translate(cx, 0); ctx.scale(U, U); ctx.translate(-cx, 0);
  rr(ctx, cx - 78, ty - 20, 156, 40, 20); ctx.fillStyle = 'rgba(10,22,70,0.75)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx - 50, ty, 12, 0, TAU); ctx.fillStyle = '#e9fff0'; ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(cx - 54.5, ty - 1, 3.2, 0, TAU); ctx.arc(cx - 45.5, ty - 1, 3.2, 0, TAU); ctx.fill();
  txt(ctx, `剩餘 ${alive}`, cx + 10, ty + 1, 22, '#ffffff');
  if (player.cubes) { drawCubeIcon(cx + 98, ty, 13); txt(ctx, String(player.cubes), cx + 120, ty + 1, 20, '#ffffff', 'left'); }
  ctx.restore();
  if (gameT > GAS_START - 6 && gameT < GAS_START + 3) txt(ctx, gameT < GAS_START ? `毒霧 ${Math.ceil(GAS_START - gameT)} 秒後出現` : '毒霧逼近！', cx, ty + 40 * U, Math.round(18 * U), '#7dff8f');
  feed.forEach((f, i) => { const a = clamp(1 - (T - f.t - 4), 0, 1); if (a <= 0) return; ctx.globalAlpha = a; txt(ctx, f.txt, W - 16, (W < 700 ? 90 : 30) * U + i * 22 * U, Math.round(15 * U), f.me ? '#ffd23f' : '#ffffff', 'right'); });
  ctx.globalAlpha = 1;

  if (state === 'play' && player.alive) {
    const L = layout();
    if (touchMode) {
      const m = sticks.move;
      if (m.id != null) { const vx = m.cx - m.ox, vy = m.cy - m.oy, l = hyp(vx, vy), k = l > STICK_R ? STICK_R / l : 1; drawStick(m.ox, m.oy, m.ox + vx * k, m.oy + vy * k, '#4fb0ff', '', true); }
      else drawStick(L.moveHome.x, L.moveHome.y, L.moveHome.x, L.moveHome.y, '#4fb0ff', '', false, true);
      const at = sticks.attack;
      if (at.id != null) { const vx = at.cx - at.ox, vy = at.cy - at.oy, l = hyp(vx, vy), k = l > STICK_R ? STICK_R / l : 1; drawStick(at.ox, at.oy, at.ox + vx * k, at.oy + vy * k, '#ff5a4e', '', true); }
      else drawStick(L.attack.x, L.attack.y, L.attack.x, L.attack.y, '#ff5a4e', '', false, player.ammo < 1);
    }
    const su = sticks.super, ready = player.superCharge >= 1, sxp = L.super.x, syp = L.super.y;
    if (su.id != null) { const vx = su.cx - su.ox, vy = su.cy - su.oy, l = hyp(vx, vy), k = l > STICK_R ? STICK_R / l : 1; drawStick(su.ox, su.oy, su.ox + vx * k, su.oy + vy * k, '#ffcf2e', '', true); }
    else {
      const r = (touchMode ? 34 : 28) * U, bx = touchMode ? sxp : W - 60 * U, by = touchMode ? syp : H - 60 * U;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fillStyle = ready ? '#ffcf2e' : 'rgba(40,40,60,0.75)'; ctx.fill();
      if (!ready) { ctx.beginPath(); ctx.moveTo(bx, by); ctx.arc(bx, by, r, -Math.PI / 2, -Math.PI / 2 + TAU * player.superCharge); ctx.closePath(); ctx.fillStyle = 'rgba(255,207,46,0.55)'; ctx.fill(); }
      ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
      if (ready) { ctx.beginPath(); ctx.arc(bx, by, r + 6 + Math.sin(T * 6) * 3, 0, TAU); ctx.strokeStyle = 'rgba(255,230,120,0.8)'; ctx.lineWidth = 3; ctx.stroke(); }
      txt(ctx, touchMode ? '大招' : 'E', bx, by, Math.round((touchMode ? 15 : 18) * U), '#ffffff');
    }
    if (!touchMode && gameT < 10) txt(ctx, 'WASD 移動 · 左鍵按住瞄準放開射擊 · 右鍵 / E 大招 · 空白鍵 自動射擊', W / 2, H - 28, 15, '#ffffff');
  }
  if (gameT < 0.8) {
    const n = Math.ceil(-gameT), s = n > 0 ? String(n) : '開打！', k = gameT < 0 ? 1 + (Math.ceil(-gameT) + gameT) * 0.4 : 1;
    txt(ctx, s, W / 2, H / 2 - 30, Math.round(84 * k * U), n > 0 ? '#ffffff' : '#ffcf2e', 'center', 10);
  }
  if (state === 'dead') txt(ctx, '你被擊倒了', W / 2, H / 2 - 30, Math.round(52 * U), '#ff6a5e', 'center', 8);
  if (state === 'won') txt(ctx, '冠軍！', W / 2, H / 2 - 30, Math.round(72 * U), '#ffcf2e', 'center', 10);
}

// ---------- 主迴圈 ----------
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (state === 'play' || state === 'dead' || state === 'won') {
    update(dt);
    const tx = player.x, ty = player.y - player.z;
    cam.x = lerp(cam.x, tx, 1 - Math.exp(-10 * dt)); cam.y = lerp(cam.y, ty, 1 - Math.exp(-10 * dt));
    draw();
  } else if (!el.lobby.hidden) drawPreview(now / 1000);
  requestAnimationFrame(frame);
}

// ---------- 大廳與結算 ----------
const el = {
  lobby: document.getElementById('lobby'), result: document.getElementById('result'), hudbar: document.getElementById('hudbar'),
  cards: document.getElementById('cards'), preview: document.getElementById('preview'), trophies: document.getElementById('trophies'),
  mute: document.getElementById('mute')
};
const TROPHY_TABLE = [10, 8, 7, 6, 4, 2, 0, -1, -2, -3];
function renderLobby() {
  el.trophies.textContent = trophies;
  const b = BR[selected];
  document.getElementById('bname').textContent = b.name;
  document.getElementById('brole').textContent = b.role;
  document.getElementById('bstats').innerHTML = [['生命', b.hp], ['傷害', b.dmgText], ['射程', b.range.toFixed(1)], ['裝填', b.reload + 's']]
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  document.getElementById('bsuper').textContent = b.superText;
  for (const btn of el.cards.children) btn.setAttribute('aria-pressed', String(btn.dataset.key === selected));
}
function buildCards() {
  for (const k of BR_KEYS) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'card stroke'; btn.dataset.key = k;
    const c = document.createElement('canvas'); c.width = 144; c.height = 144;
    const g = c.getContext('2d'); drawBrawler(g, k, 72, 122, 40, 0.5);
    btn.append(c, document.createTextNode(BR[k].name));
    btn.addEventListener('click', () => { selected = k; store.set('brawler', k); renderLobby(); });
    el.cards.append(btn);
  }
}
function drawPreview(t) {
  const c = el.preview, g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(150, 238, 76, 22, 0, 0, TAU); g.fill();
  g.strokeStyle = '#ffcf2e'; g.lineWidth = 6; g.beginPath(); g.ellipse(150, 238, 88, 27, 0, 0, TAU); g.stroke();
  const bob = reduceMotion ? 0 : Math.sin(t * 3) * 5;
  drawBrawler(g, selected, 150, 238, 72, reduceMotion ? 0.6 : 0.6 + Math.sin(t * 0.8) * 0.9, { z: Math.max(0, bob) });
}
function showResult() {
  state = 'result'; el.hudbar.hidden = true;
  const delta = TROPHY_TABLE[playerRank - 1] ?? -3;
  trophies = Math.max(0, trophies + delta); store.set('trophies', trophies);
  document.getElementById('rrank').innerHTML = `第 ${playerRank} 名<small>${playerRank === 1 ? '荒野之王！' : playerRank <= 4 ? '打得不錯' : '再接再厲'}</small>`;
  document.getElementById('rdelta').textContent = (delta > 0 ? '+' : '') + delta + `  （共 ${trophies}）`;
  document.getElementById('rstats').innerHTML = [['擊倒', player.kills], ['能量', player.cubes], ['存活', Math.max(0, Math.floor(gameT)) + ' 秒']]
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  el.result.hidden = false;
}
function toLobby() { state = 'lobby'; el.result.hidden = true; el.hudbar.hidden = true; el.lobby.hidden = false; renderLobby(); }
document.getElementById('play').addEventListener('click', () => { snd('tick'); startGame(); });
document.getElementById('again').addEventListener('click', startGame);
document.getElementById('home').addEventListener('click', toLobby);
document.getElementById('quit').addEventListener('click', () => { if (state === 'play' && player.alive) { playerRank = ents.filter(e => e.alive).length; showResult(); } else toLobby(); });
const zoomBtn = document.getElementById('zoom');
const syncZoom = () => { zoomBtn.textContent = '視野 ' + ZOOMS[zoomIdx].label; };
zoomBtn.addEventListener('click', () => { zoomIdx = (zoomIdx + 1) % ZOOMS.length; store.set('zoom', zoomIdx); resize(); syncZoom(); });
syncZoom();
const syncMute = () => { el.mute.textContent = muted ? '音效 關' : '音效 開'; };
el.mute.addEventListener('click', () => { muted = !muted; store.set('muted', muted); syncMute(); });
syncMute();
buildCards(); renderLobby();
requestAnimationFrame(frame);
window.__brawl = { get state() { return state; }, get ents() { return ents; }, startGame, update: dt => update(dt) };
})();
</script>
</body>
</html>
