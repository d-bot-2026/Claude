<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>亂鬥競技場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* 版面：全螢幕畫布遊戲，大廳與結算是疊在上方的面板。單一亮色街機風格，不跟系統深淺色切換。 */
:root {
  --sky: #1d63d8;
  --sky-deep: #0f3c9a;
  --ink: #160b22;
  --gold: #ffcf2e;
  --gold-deep: #d99a00;
  --paper: #ffffff;
  --mint: #3fd46a;
  --gem: #b45cff;
  --danger: #ff4f45;
  --muted: #b9d0ff;
  --panel: rgba(10, 22, 70, 0.55);
  --display: "Lilita One", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky-deep); color: var(--paper); font-family: var(--body); }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
canvas#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.stroke { -webkit-text-stroke: 0.09em var(--ink); paint-order: stroke fill; text-shadow: 0 0.09em 0 var(--ink); }

.overlay {
  position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 28px, rgba(255,255,255,0) 28px 56px),
    radial-gradient(120% 90% at 50% 0%, #3d8bff 0%, var(--sky) 45%, var(--sky-deep) 100%);
  display: flex; flex-direction: column; gap: 12px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: clamp(24px, 4vw, 38px); letter-spacing: 0.02em; color: var(--gold); line-height: 1; }
.brand small { display: block; font-size: 0.42em; color: var(--paper); letter-spacing: 0.25em; margin-top: 4px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 6px; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.pill svg { width: 28px; height: 28px; }
.lobby-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: center; max-width: 1120px; width: 100%; margin: 0 auto; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
#preview { width: min(260px, 60vw, 28vh); aspect-ratio: 1; max-width: 100%; }
.bname { font-family: var(--display); font-size: clamp(26px, 4vw, 40px); line-height: 1; text-align: center; }
.bmeta { font-size: 14px; letter-spacing: 0.12em; color: #cfe1ff; text-align: center; }
.bmeta b { color: var(--gold); font-weight: 900; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 440px; margin: 6px 0 0; }
.stats div { background: var(--panel); border: 2px solid rgba(0,0,0,0.45); border-radius: 10px; padding: 6px 4px; text-align: center; min-width: 0; }
.stats dt, .rstats dt { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--display); font-size: 19px; font-variant-numeric: tabular-nums; }
.abil { display: grid; gap: 6px; width: 100%; max-width: 440px; font-size: 13px; line-height: 1.5; }
.abil p { margin: 0; background: var(--panel); border-radius: 10px; padding: 6px 10px; }
.abil b { font-weight: 900; }
.abil .sup b { color: #ffe066; }
.abil .gad b { color: #7dff9a; }
.btn.upg { font-size: 18px; padding: 6px 16px 8px; background: linear-gradient(180deg, #8dff9f, #2fc25a 55%, #178a3c); box-shadow: 0 5px 0 var(--ink); }
.btn.upg:disabled { filter: grayscale(0.85) brightness(0.8); cursor: not-allowed; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.label { font-family: var(--display); font-size: 15px; letter-spacing: 0.18em; color: #cfe1ff; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.modebtn { appearance: none; border: 3px solid var(--ink); border-radius: 14px; color: var(--paper); padding: 8px 6px 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--display); font-size: 16px; box-shadow: 0 5px 0 var(--ink); min-width: 0; opacity: 0.72; transition: transform 0.08s, opacity 0.12s; }
.modebtn svg { width: 34px; height: 34px; }
.modebtn small { font-family: var(--body); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; }
.modebtn[data-mode="showdown"] { background: linear-gradient(180deg, #45d16f, #168a3f); }
.modebtn[data-mode="gem"] { background: linear-gradient(180deg, #c27bff, #7a2fd0); }
.modebtn[data-mode="ball"] { background: linear-gradient(180deg, #5fb6ff, #1f62d6); }
.modebtn[aria-pressed="true"] { opacity: 1; outline: 3px solid var(--gold); outline-offset: 2px; }
.mode-desc { font-size: 13px; line-height: 1.55; color: #e2ecff; background: var(--panel); border-radius: 12px; padding: 8px 12px; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.card { appearance: none; position: relative; border: 3px solid var(--ink); border-radius: 14px; background: linear-gradient(180deg, #6fb2ff, #2a6fe0); color: var(--paper); padding: 4px 3px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; font-family: var(--display); font-size: 14px; box-shadow: 0 4px 0 var(--ink); transition: transform 0.08s; min-width: 0; }
.card canvas { width: 60px; height: 60px; max-width: 100%; }
.card .cname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.card small { font-family: var(--body); font-size: 11px; font-weight: 500; color: #e6efff; font-variant-numeric: tabular-nums; }
.card[aria-pressed="true"] { background: linear-gradient(180deg, #ffe066, #f4a90b); color: var(--ink); }
.card[aria-pressed="true"] small { color: var(--ink); }
.card.locked { background: linear-gradient(180deg, #6a7488, #3c4456); }
.card.locked canvas { filter: grayscale(1) brightness(0.55); }
.card:active, .modebtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.card:focus-visible, .btn:focus-visible, .mini:focus-visible, .modebtn:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.btn { appearance: none; border: 4px solid var(--ink); border-radius: 16px; background: linear-gradient(180deg, #ffe45c, var(--gold) 55%, var(--gold-deep)); color: var(--paper); font-family: var(--display); font-size: 32px; padding: 8px 18px 10px; cursor: pointer; box-shadow: 0 7px 0 var(--ink); transition: transform 0.08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--ink); }
.btn.secondary { background: linear-gradient(180deg, #7cc0ff, #2f7ee8); font-size: 22px; }
.btn:disabled { filter: grayscale(0.9) brightness(0.75); cursor: not-allowed; }
.howto { font-size: 12.5px; line-height: 1.6; color: #dbe8ff; background: var(--panel); border-radius: 12px; padding: 8px 12px; }
.howto b { color: var(--gold); font-weight: 900; }

#hudbar { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; z-index: 5; }
.mini { appearance: none; border: 3px solid var(--ink); border-radius: 10px; background: rgba(10, 22, 70, 0.7); color: var(--paper); font-family: var(--display); font-size: 15px; padding: 4px 10px; cursor: pointer; }

#result { align-items: center; justify-content: center; text-align: center; background: radial-gradient(90% 80% at 50% 30%, rgba(61,139,255,0.95), rgba(15,60,154,0.97)); }
.rank { font-family: var(--display); font-size: clamp(56px, 13vw, 112px); line-height: 0.95; color: var(--gold); }
.rank.lose { color: #ff8a80; }
.rank.draw { color: var(--paper); }
.rank small { display: block; font-size: 0.28em; color: var(--paper); margin-top: 8px; }
.rewards { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.tdelta { font-family: var(--display); font-size: 28px; display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.tdelta svg { width: 34px; height: 34px; }
.unlock { font-family: var(--display); font-size: 22px; color: #7dff9a; }
.rstats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0; }
.rstats div { background: var(--panel); border-radius: 12px; padding: 8px 14px; min-width: 88px; }
.rstats dd { margin: 0; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.rbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 780px) {
  .lobby-main { grid-template-columns: minmax(0, 1fr); }
  .side { order: -1; }
  .btn { font-size: 28px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .lobby-main { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); align-items: start; }
  #preview { width: min(130px, 30vh); }
  .howto, .mode-desc { display: none; }
  .stats dd { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .card, .btn, .modebtn { transition: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudbar" hidden>
  <button class="mini" id="quit" type="button">離開</button>
  <button class="mini" id="mute" type="button">音效 開</button>
  <button class="mini" id="zoom" type="button">視野 標準</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-trophy" viewBox="0 0 32 32"><path d="M8 4h16v6a8 8 0 0 1-16 0z" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 6H3v2a5 5 0 0 0 5 5M24 6h5v2a5 5 0 0 1-5 5" fill="none" stroke="#160b22" stroke-width="2.5"/><path d="M13 18h6v5h3v5H10v-5h3z" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-coin" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="#ffcf2e" stroke="#160b22" stroke-width="2.5"/><circle cx="16" cy="16" r="7.5" fill="none" stroke="#d99a00" stroke-width="2.5"/><path d="M16 11v10" stroke="#d99a00" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-skull" viewBox="0 0 44 44"><circle cx="22" cy="20" r="15" fill="#e9fff0" stroke="#160b22" stroke-width="3"/><rect x="14" y="30" width="16" height="9" rx="2" fill="#e9fff0" stroke="#160b22" stroke-width="3"/><circle cx="16" cy="20" r="4.5" fill="#160b22"/><circle cx="28" cy="20" r="4.5" fill="#160b22"/></symbol>
    <symbol id="i-gem" viewBox="0 0 44 44"><path d="M22 4 37 18 22 40 7 18z" fill="#c983ff" stroke="#160b22" stroke-width="3" stroke-linejoin="round"/><path d="M7 18h30M22 4l-6 14 6 22 6-22z" fill="none" stroke="#160b22" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-ball" viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="#fff" stroke="#160b22" stroke-width="3"/><path d="M22 15l7 5-3 8h-8l-3-8z" fill="#160b22"/><path d="M22 15V6M29 20l8-3M26 28l5 7M18 28l-5 7M15 20l-8-3" stroke="#160b22" stroke-width="2.5"/></symbol>
  </defs>
</svg>

<div id="lobby" class="overlay">
  <header class="topbar">
    <div class="brand stroke">亂鬥競技場<small>BRAWL ARENA</small></div>
    <div class="pills">
      <div class="pill stroke" title="金幣"><svg aria-hidden="true"><use href="#i-coin"/></svg><span id="coins">0</span></div>
      <div class="pill stroke" title="總獎盃"><svg aria-hidden="true"><use href="#i-trophy"/></svg><span id="trophies">0</span></div>
    </div>
  </header>
  <main class="lobby-main">
    <section class="stage">
      <canvas id="preview" width="260" height="260"></canvas>
      <div class="bname stroke" id="bname"></div>
      <div class="bmeta" id="bmeta"></div>
      <dl class="stats" id="bstats"></dl>
      <div class="abil" id="babil"></div>
      <button class="btn upg stroke" id="upgrade" type="button">升級</button>
    </section>
    <section class="side">
      <div class="label">模式</div>
      <div class="modes" id="modes"></div>
      <div class="mode-desc" id="modedesc"></div>
      <div class="label">鬥士</div>
      <div class="cards" id="cards"></div>
      <button class="btn stroke" id="play" type="button">開戰！</button>
      <div class="howto">
        <b>手機</b>：左半邊拖曳移動。右下紅色搖桿拖曳瞄準、放開射擊，輕點自動瞄準。黃色是大招，綠色是道具（每場 3 次）。<br>
        <b>電腦</b>：WASD 移動。按住滑鼠左鍵瞄準、放開射擊，右鍵大招，Q 道具。空白鍵自動射擊，E 自動大招。
      </div>
    </section>
  </main>
</div>

<div id="result" class="overlay" hidden>
  <div class="rank stroke" id="rtitle"></div>
  <div class="rewards">
    <span class="tdelta stroke"><svg aria-hidden="true"><use href="#i-trophy"/></svg><span id="rdelta"></span></span>
    <span class="tdelta stroke"><svg aria-hidden="true"><use href="#i-coin"/></svg><span id="rcoins"></span></span>
  </div>
  <div class="unlock stroke" id="runlock" hidden></div>
  <dl class="rstats" id="rstats"></dl>
  <div class="rbtns">
    <button class="btn stroke" id="again" type="button">再來一場</button>
    <button class="btn secondary stroke" id="home" type="button">回大廳</button>
  </div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 儲存 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('brawlArena.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('brawlArena.' + k, JSON.stringify(v)); } catch {} }
};

// ---------- 音效 ----------
let AC = null, muted = store.get('muted', false), lastHitSnd = 0;
function snd(type) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const tone = (wave, f0, f1, dur, vol, delay = 0) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.connect(g); g.connect(AC.destination);
      o.type = wave; o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(f1, t + delay + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.setValueAtTime(vol, t + delay); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.start(t); o.stop(t + delay + dur + 0.02);
    };
    if (type === 'shoot') tone('square', 420, 120, 0.09, 0.05);
    else if (type === 'hit') { if (t - lastHitSnd < 0.05) return; lastHitSnd = t; tone('triangle', 260, 80, 0.08, 0.08); }
    else if (type === 'cube') tone('sine', 500, 1400, 0.25, 0.12);
    else if (type === 'gem') { tone('sine', 900, 1500, 0.12, 0.09); tone('sine', 1300, 2000, 0.12, 0.07, 0.08); }
    else if (type === 'super') tone('sawtooth', 160, 700, 0.35, 0.09);
    else if (type === 'gadget') tone('triangle', 600, 1200, 0.2, 0.1);
    else if (type === 'heal') tone('sine', 520, 1040, 0.3, 0.08);
    else if (type === 'die') tone('sawtooth', 300, 40, 0.5, 0.1);
    else if (type === 'boom') tone('sawtooth', 120, 30, 0.35, 0.14);
    else if (type === 'box') tone('square', 180, 50, 0.2, 0.08);
    else if (type === 'kick') tone('triangle', 220, 90, 0.12, 0.14);
    else if (type === 'tick') tone('sine', 880, 880, 0.12, 0.08);
    else if (type === 'goal') { tone('square', 523, 523, 0.15, 0.08); tone('square', 659, 659, 0.15, 0.08, 0.15); tone('square', 784, 784, 0.3, 0.08, 0.3); }
    else if (type === 'win') { tone('triangle', 523, 1046, 0.5, 0.1); tone('triangle', 659, 1318, 0.5, 0.08, 0.12); }
  } catch {}
}

// ---------- 地圖 ----------
const FLOOR = 0, WALL = 1, BORDER = 2, BUSH = 3, WATER = 4, BOX = 5, GOAL = 6, MINE = 7;
let MW = 40, MH = 40, CX = 20, CY = 20;
let map = new Uint8Array(MW * MH), boxHp = new Float32Array(MW * MH), prevBuf = new Int32Array(MW * MH), qBuf = new Int32Array(MW * MH);
let ffaSpawns = [], teamSpawns = [[], []], mapName = '';
const tAt = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? BORDER : map[y * MW + x];
const solidMove = t => t === WALL || t === BORDER || t === WATER || t === BOX || t === GOAL || t === MINE;
const solidShot = t => t === WALL || t === BORDER || t === BOX || t === GOAL || t === MINE;
const solidBall = t => t === WALL || t === BORDER || t === BOX || t === MINE;
const BOX_HP = 2800;
function setMap(w, h) {
  MW = w; MH = h; CX = w / 2; CY = h / 2;
  map = new Uint8Array(w * h); boxHp = new Float32Array(w * h); prevBuf = new Int32Array(w * h); qBuf = new Int32Array(w * h);
}

function genShowdown() {
  const N = 40, C = 20; setMap(N, N); mapName = '荒野峽谷';
  const Q = 20, q = new Uint8Array(Q * Q);
  const qset = (x, y, v, only) => { if (x < 1 || y < 1 || x >= Q || y >= Q) return; if (only != null && q[y * Q + x] !== only) return; q[y * Q + x] = v; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  for (let k = 0; k < 10; k++) {
    const x = ri(2, 18), y = ri(2, 18), s = ri(0, 3), len = ri(2, 4);
    if (s === 0) for (let i = 0; i < len; i++) qset(x + i, y, WALL);
    else if (s === 1) for (let i = 0; i < len; i++) qset(x, y + i, WALL);
    else if (s === 2) { for (let i = 0; i < len; i++) qset(x + i, y, WALL); for (let i = 0; i < len; i++) qset(x, y + i, WALL); }
    else { qset(x, y, WALL); qset(x + 1, y, WALL); qset(x, y + 1, WALL); qset(x + 1, y + 1, WALL); }
  }
  for (let k = 0; k < 8; k++) {
    const cx = ri(2, 18), cy = ri(2, 18), rad = 1 + rnd() * 1.6;
    for (let y = cy - 3; y <= cy + 3; y++) for (let x = cx - 3; x <= cx + 3; x++)
      if (hyp(x - cx, y - cy) < rad + rnd() * 0.7) qset(x, y, BUSH, FLOOR);
  }
  if (rnd() < 0.85) { const wx = ri(4, 14), wy = ri(4, 14), ww = ri(2, 3), wh = ri(1, 2); for (let y = wy; y < wy + wh; y++) for (let x = wx; x < wx + ww; x++) qset(x, y, WATER); }
  let placed = 0, guard = 0;
  while (placed < 3 && guard++ < 200) { const x = ri(3, 18), y = ri(3, 18); if (q[y * Q + x] === FLOOR) { q[y * Q + x] = BOX; placed++; } }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const qx = x < Q ? x : N - 1 - x, qy = y < Q ? y : N - 1 - y;
    map[y * N + x] = (x === 0 || y === 0 || x === N - 1 || y === N - 1) ? BORDER : q[qy * Q + qx];
  }
  for (let y = C - 2; y < C + 2; y++) for (let x = C - 2; x < C + 2; x++) if (map[y * N + x] !== BUSH) map[y * N + x] = FLOOR;
  ffaSpawns = [];
  const a0 = rnd() * TAU;
  for (let i = 0; i < 10; i++) {
    const a = a0 + i * TAU / 10, sx = C + Math.cos(a) * 14.5, sy = C + Math.sin(a) * 14.5;
    ffaSpawns.push({ x: Math.floor(sx) + 0.5, y: Math.floor(sy) + 0.5 });
    for (let y = Math.floor(sy) - 1; y <= Math.floor(sy) + 1; y++) for (let x = Math.floor(sx) - 1; x <= Math.floor(sx) + 1; x++)
      if (x > 0 && y > 0 && x < N - 1 && y < N - 1 && map[y * N + x] !== BUSH) map[y * N + x] = FLOOR;
  }
  const flood = () => {
    const seen = new Uint8Array(N * N), qu = [C * N + C]; seen[C * N + C] = 1;
    while (qu.length) { const i = qu.pop(), x = i % N, y = (i / N) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const j = (y + dy) * N + x + dx, t = map[j];
        if (!seen[j] && (t === FLOOR || t === BUSH || t === BOX)) { seen[j] = 1; qu.push(j); } } }
    return seen;
  };
  let seen = flood();
  for (const s of ffaSpawns) {
    if (seen[Math.floor(s.y) * N + Math.floor(s.x)]) continue;
    let x = s.x, y = s.y; const d = hyp(C - x, C - y);
    for (let i = 0; i < d * 3; i++) { x += (C - s.x) / (d * 3); y += (C - s.y) / (d * 3);
      const j = Math.floor(y) * N + Math.floor(x); if (map[j] === WALL || map[j] === WATER) map[j] = FLOOR; }
    seen = flood();
  }
  for (let i = 0; i < N * N; i++) {
    if (!seen[i] && (map[i] === FLOOR || map[i] === BUSH || map[i] === BOX)) map[i] = WALL;
    boxHp[i] = map[i] === BOX ? BOX_HP : 0;
  }
}

    const k = btn.dataset.key, ok = unlocked(k);
    btn.setAttribute('aria-pressed', String(k === selected));
    btn.classList.toggle('locked', !ok);
    btn.querySelector('small').textContent = ok ? `等級 ${prog.br[k].lvl} · ${prog.br[k].tro} 盃` : `${BR[k].unlock} 盃解鎖`;
  }
  for (const btn of el.modes.children) btn.setAttribute('aria-pressed', String(btn.dataset.mode === selMode));
  document.getElementById('modedesc').textContent = MODES[selMode].desc;
}
function buildLobby() {
  for (const k of BR_KEYS) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'card stroke'; btn.dataset.key = k;
    const c = document.createElement('canvas'); c.width = 120; c.height = 120;
    drawBrawler(c.getContext('2d'), k, 60, 102, 33, 0.5);
    const nm = document.createElement('span'); nm.className = 'cname'; nm.textContent = BR[k].name;
    btn.append(c, nm, document.createElement('small'));
    btn.addEventListener('click', () => {
      if (!unlocked(k)) { btn.animate?.([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], { duration: 200 }); return; }
      selected = k; store.set('brawler', k); renderLobby();
    });
    el.cards.append(btn);
  }
  for (const [k, m] of Object.entries(MODES)) {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'modebtn stroke'; btn.dataset.mode = k;
    btn.innerHTML = `<svg aria-hidden="true"><use href="#${m.icon}"/></svg>${m.name}<small>${m.sub}</small>`;
    btn.addEventListener('click', () => { selMode = k; store.set('mode', k); renderLobby(); });

}
function drawPreview(t) {
  const c = el.preview, g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(130, 212, 70, 20, 0, 0, TAU); g.fill();
  g.strokeStyle = '#ffcf2e'; g.lineWidth = 6; g.beginPath(); g.ellipse(130, 212, 80, 25, 0, 0, TAU); g.stroke();
  const bob = reduceMotion ? 0 : Math.sin(t * 3) * 5;
  drawBrawler(g, selected, 130, 212, 62, reduceMotion ? 0.6 : 0.6 + Math.sin(t * 0.8) * 0.9, { z: Math.max(0, bob) });
}
function showResult() {
  if (state === 'result') return;
  state = 'result'; el.hudbar.hidden = true;
  const before = BR_KEYS.filter(unlocked);
  const p = prog.br[player.key];
  let title, cls = '', sub, dTro, coins;
  if (mode === 'showdown') {
    dTro = SHOWDOWN_TRO[playerRank - 1] ?? -3; coins = (SHOWDOWN_COIN[playerRank - 1] ?? 4) + player.kills * 2;
    title = `第 ${playerRank} 名`; sub = playerRank === 1 ? '荒野之王！' : playerRank <= 4 ? '打得不錯' : '再接再厲';
    cls = playerRank <= 4 ? '' : 'lose';
  } else {
    const w = outcome;
    dTro = w === 0 ? 8 : w === 1 ? -4 : 0; coins = (w === 0 ? 26 : w === 1 ? 9 : 14) + player.kills * 2;
    title = w === 0 ? '勝利！' : w === 1 ? '落敗' : '平手'; cls = w === 0 ? '' : w === 1 ? 'lose' : 'draw';
    sub = `${MODES[mode].name} · ${mode === 'gem' ? `寶石 ${teamGems(0)} : ${teamGems(1)}` : `比分 ${score[0]} : ${score[1]}`}`;
  }
  dTro = Math.max(-p.tro, dTro);
  p.tro += dTro; prog.coins += coins; saveProg();
  const after = BR_KEYS.filter(unlocked).filter(k => !before.includes(k));
  const rt = document.getElementById('rtitle');
  rt.className = 'rank stroke ' + cls;
  rt.innerHTML = `${title}<small>${sub}</small>`;
  document.getElementById('rdelta').textContent = (dTro > 0 ? '+' : '') + dTro;
  document.getElementById('rcoins').textContent = '+' + coins;
  const un = document.getElementById('runlock');
  un.hidden = !after.length; un.textContent = after.length ? `解鎖新鬥士：${after.map(k => BR[k].name).join('、')}！` : '';
  const stats = [['擊倒', player.kills], ['傷害', player.dmgDealt]];
  if (mode === 'showdown') stats.push(['能量', player.cubes], ['存活', Math.max(0, Math.floor(gameT)) + ' 秒']);
  else if (mode === 'gem') stats.push(['撿到寶石', player.gemsTotal], ['倒下', player.deaths]);
  else stats.push(['進球', player.goals], ['倒下', player.deaths]);
  document.getElementById('rstats').innerHTML = stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  el.result.hidden = false;
}
function toLobby() { state = 'lobby'; el.result.hidden = true; el.hudbar.hidden = true; el.lobby.hidden = false; renderLobby(); }
el.play.addEventListener('click', () => { snd('tick'); startGame(); });
el.upgrade.addEventListener('click', () => {
  const p = prog.br[selected]; if (p.lvl >= MAX_LVL) return;
  const cost = UPGRADE_COST[p.lvl]; if (prog.coins < cost) return;
  prog.coins -= cost; p.lvl++; saveProg(); snd('cube'); renderLobby();
});
document.getElementById('again').addEventListener('click', startGame);
document.getElementById('home').addEventListener('click', toLobby);
document.getElementById('quit').addEventListener('click', () => {
  if (state === 'play') {
    if (mode === 'showdown') playerRank = player.alive ? ents.filter(e => e.alive).length : playerRank || ents.filter(e => e.alive).length + 1;
    else outcome = 1;
  }
  showResult();
});
const zoomBtn = document.getElementById('zoom');
const syncZoom = () => { zoomBtn.textContent = '視野 ' + ZOOMS[zoomIdx].label; };
zoomBtn.addEventListener('click', () => { zoomIdx = (zoomIdx + 1) % ZOOMS.length; store.set('zoom', zoomIdx); resize(); syncZoom(); });
syncZoom();
const syncMute = () => { el.mute.textContent = muted ? '音效 關' : '音效 開'; };
el.mute.addEventListener('click', () => { muted = !muted; store.set('muted', muted); syncMute(); });
syncMute();
saveProg();
buildLobby(); renderLobby();
requestAnimationFrame(frame);
window.__brawl = {
  get state() { return state; }, get ents() { return ents; }, get score() { return score; }, get ball() { return ball; }, get outcome() { return outcome; },
  get gems() { return gems; }, get matchT() { return matchT; }, teamGems, setMode(m) { selMode = m; }, startGame, update: dt => update(dt), get prog() { return prog; },
  mapCheck() { return { MW, MH, spawns: teamSpawns.map(s => s.length), map: Array.from(map) }; }, bfs: (a, b, c, d) => bfs(a, b, c, d)
};
})();
